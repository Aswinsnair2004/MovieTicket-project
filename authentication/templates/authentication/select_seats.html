<h2>Select Seats for {{ show.movie.title }}</h2>
<p>Show Time: {{ show.show_time }}</p>
<p>Language: {{ show.language }}</p>
<p>Format: {{ show.format }}</p>

<form method="post" action="{% url 'select_seats' show.id %}">

    {% csrf_token %}
    <div style="display: grid; grid-template-columns: repeat(10, 1fr); gap: 10px;">
        {% for seat_id in seat_ids %}
            <label>
                <input type="checkbox" name="seats" value="{{ seat_id }}" 
                    {% if seat_id in booked_seats %}disabled{% endif %}>
                {{ seat_id }}
            </label>
        {% endfor %}
    </div>
    <button type="submit" class="btn btn-primary mt-3">Confirm Booking</button>
</form>
